[tox]
isolated_build = True
envlist = py39,py310,py311,py312,py313
requires =
    tox-poetry

[testenv]
whitelist_externals = poetry
commands_pre =
    poetry install --no-root --sync --with dev
commands =
    poetry run pytest {posargs:tests} -s

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows
